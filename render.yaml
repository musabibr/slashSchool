# Render Blueprint: one web service (API + web app) and one Postgres database.
# Render → New → Blueprint → pick this repo. Every push to the linked branch redeploys.
services:
  - type: web
    name: slashschool
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Demo logins on the login page + demo data loaded into an empty database.
      # Set to "false" before real use.
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: slashschool-db
          property: connectionString

databases:
  - name: slashschool-db
    plan: free
    region: frankfurt
    databaseName: slashschool
    user: slashschool
